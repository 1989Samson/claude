name: Auction ingestion

# Pulls newly closed auction results, normalizes each lot with the Claude API,
# and posts them to the app's import endpoint, which writes to the shared
# database. Runs on a schedule; can also be triggered manually.
on:
  schedule:
    # 07:00 UTC daily. GovPlanet runs two auctions a week; a daily pull is cheap
    # and catches new results without missing a window.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and normalize but do not import"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Skip cleanly (green, no failure email) until the app is deployed and the
      # required secrets exist. Auto-activates once APP_URL, INGEST_API_TOKEN, and
      # ANTHROPIC_API_KEY are set.
      - name: Check configuration
        id: cfg
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$INGEST_API_TOKEN" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Ingestion not configured yet (missing APP_URL / INGEST_API_TOKEN / ANTHROPIC_API_KEY). Skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        if: steps.cfg.outputs.configured == 'true'
      - name: Run ingestion
        if: steps.cfg.outputs.configured == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # SOURCE selects the adapter (default gsa). DATA_GOV_API_KEY is a free
          # key from https://api.data.gov/signup/ (DEMO_KEY works at low volume).
          SOURCE: ${{ vars.INGEST_SOURCE }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          INGEST_MODEL: ${{ vars.INGEST_MODEL }}
          GSA_AUCTIONS_URL: ${{ vars.GSA_AUCTIONS_URL }}
          GOVDEALS_RESULTS_URLS: ${{ vars.GOVDEALS_RESULTS_URLS }}
          SALVEX_RESULTS_URLS: ${{ vars.SALVEX_RESULTS_URLS }}
          MAX_LOTS: ${{ vars.MAX_LOTS }}
        run: |
          npm run ingest -- ${{ inputs.dry_run && '--dry-run' || '' }}
